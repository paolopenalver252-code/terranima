      <!-- ============ CONSTRUIR EN LANZAROTE (estructura del bloque de testimonios) ============ -->
      <!-- No hay testimonios reales: el carrusel recoge información general sobre construir en la isla. -->
      <section class="dark section" id="lanzarote" aria-labelledby="lanzarote-title">
        <div class="container">
          <div class="sec-head sec-head--center sec-head--dark">
            <h2 class="t-section chars" id="lanzarote-title">Construir en Lanzarote</h2>
            <p class="t-body-l" data-appear>El terreno, el clima y el paisaje de la isla condicionan cada obra. Esto es lo que tenemos en cuenta antes de empezar.</p>
          </div>

          <div class="carousel" data-carousel>
            <div class="carousel__media" aria-hidden="true">
              <div class="slide-img" data-slide="0"><img data-pic="n-lava" sizes="320px" alt="" loading="lazy" decoding="async" /></div>
              <div class="slide-img" data-slide="1"><img data-pic="n-lz-blanco-costa" sizes="320px" alt="" loading="lazy" decoding="async" /></div>
              <div class="slide-img" data-slide="2"><img data-pic="mat-la-geria" sizes="320px" alt="" loading="lazy" decoding="async" /></div>
              <div class="slide-img" data-slide="3"><img data-pic="n-muro-piedra" sizes="320px" alt="" loading="lazy" decoding="async" /></div>
              <div class="slide-img" data-slide="4"><img data-pic="contacto-costa" sizes="320px" alt="" loading="lazy" decoding="async" /></div>
              <dl class="facts" data-facts>
                <div><dt>Tema</dt><dd data-fact-a>Terreno</dd></div>
                <div><dt>Servicio</dt><dd data-fact-b>Obra nueva</dd></div>
              </dl>
            </div>

            <div class="quotes" aria-live="polite">
              <figure class="quote" data-quote data-a="Terreno" data-b="Obra nueva">
                <svg class="quote__mark" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M4 18c0-6 3-10 9-12l1 3c-3 1-5 3-5 6h4v9H4zm15 0c0-6 3-10 9-12l1 3c-3 1-5 3-5 6h4v9h-9z" /></svg>
                <blockquote class="quote__text">El suelo volcánico <span class="dim">cambia de una parcela a otra</span>: picón, coladas y rellenos. El estudio geotécnico del proyecto <span class="dim">decide cómo se cimenta</span> cada edificio.</blockquote>
                <figcaption class="quote__foot">
                  <span class="quote__author">
                    <span class="quote__avatar"><img data-pic="n-lava" sizes="80px" alt="" loading="lazy" /></span>
                    <span><span class="quote__name">El terreno</span><span class="quote__role" style="display: block">Construir en Lanzarote</span></span>
                  </span>
                </figcaption>
              </figure>
              <figure class="quote" data-quote data-a="Clima" data-b="Todas las obras">
                <svg class="quote__mark" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M4 18c0-6 3-10 9-12l1 3c-3 1-5 3-5 6h4v9H4zm15 0c0-6 3-10 9-12l1 3c-3 1-5 3-5 6h4v9h-9z" /></svg>
                <blockquote class="quote__text">Sol intenso, <span class="dim">viento casi constante</span> y salitre cerca de la costa: tres factores que deciden <span class="dim">materiales, protecciones</span> y acabados exteriores.</blockquote>
                <figcaption class="quote__foot">
                  <span class="quote__author">
                    <span class="quote__avatar"><img data-pic="n-lz-blanco-costa" sizes="80px" alt="" loading="lazy" /></span>
                    <span><span class="quote__name">El clima</span><span class="quote__role" style="display: block">Construir en Lanzarote</span></span>
                  </span>
                </figcaption>
              </figure>
              <figure class="quote" data-quote data-a="Paisaje" data-b="Normativa">
                <svg class="quote__mark" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M4 18c0-6 3-10 9-12l1 3c-3 1-5 3-5 6h4v9H4zm15 0c0-6 3-10 9-12l1 3c-3 1-5 3-5 6h4v9h-9z" /></svg>
                <blockquote class="quote__text">La isla cuida <span class="dim">la integración de la arquitectura en el paisaje</span>; las ordenanzas pueden regular <span class="dim">alturas, volúmenes y colores</span> de fachada.</blockquote>
                <figcaption class="quote__foot">
                  <span class="quote__author">
                    <span class="quote__avatar"><img data-pic="mat-la-geria" sizes="80px" alt="" loading="lazy" /></span>
                    <span><span class="quote__name">El paisaje</span><span class="quote__role" style="display: block">Construir en Lanzarote</span></span>
                  </span>
                </figcaption>
              </figure>
              <figure class="quote" data-quote data-a="Tradición" data-b="Rehabilitación">
                <svg class="quote__mark" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M4 18c0-6 3-10 9-12l1 3c-3 1-5 3-5 6h4v9H4zm15 0c0-6 3-10 9-12l1 3c-3 1-5 3-5 6h4v9h-9z" /></svg>
                <blockquote class="quote__text">Muros de piedra, <span class="dim">paramentos encalados</span> y cubiertas planas definen la casa tradicional. <span class="dim">Entenderla es el punto de partida</span> para rehabilitarla.</blockquote>
                <figcaption class="quote__foot">
                  <span class="quote__author">
                    <span class="quote__avatar"><img data-pic="n-muro-piedra" sizes="80px" alt="" loading="lazy" /></span>
                    <span><span class="quote__name">La tradición</span><span class="quote__role" style="display: block">Construir en Lanzarote</span></span>
                  </span>
                </figcaption>
              </figure>
              <figure class="quote" data-quote data-a="Conservación" data-b="Reparación">
                <svg class="quote__mark" viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><path d="M4 18c0-6 3-10 9-12l1 3c-3 1-5 3-5 6h4v9H4zm15 0c0-6 3-10 9-12l1 3c-3 1-5 3-5 6h4v9h-9z" /></svg>
                <blockquote class="quote__text">Llueve poco, <span class="dim">pero con fuerza</span>: cubiertas planas y desagües se ponen a prueba. <span class="dim">Revisarlos antes del otoño</span> evita daños mayores.</blockquote>
                <figcaption class="quote__foot">
                  <span class="quote__author">
                    <span class="quote__avatar"><img data-pic="contacto-costa" sizes="80px" alt="" loading="lazy" /></span>
                    <span><span class="quote__name">El mantenimiento</span><span class="quote__role" style="display: block">Construir en Lanzarote</span></span>
                  </span>
                </figcaption>
              </figure>
              <div class="arrows">
                <button type="button" data-prev aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6l-6 6 6 6" /></svg></button>
                <button type="button" data-next aria-label="Siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6" /></svg></button>
              </div>
            </div>
          </div>
        </div>
      </section>
