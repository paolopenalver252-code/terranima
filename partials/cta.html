      <!-- ============ CONTACTO ============ -->
      <section class="cta" data-theme="dark" aria-labelledby="cta-title">
        <div class="cta__media" data-parallax="0.12" aria-hidden="true">
          <img data-pic="{{img}}" sizes="100vw" alt="" loading="lazy" decoding="async" />
        </div>
        <div class="wrap cta__grid">
          <div class="cta__text">
            <p class="label label--toba" data-reveal>Contacto</p>
            <h2 class="display-2" id="cta-title">{{title}}</h2>
            <p class="lead" data-reveal>{{text}}</p>
            <div class="actions" data-reveal>
              <a class="btn btn--light" href="{{href}}"><span>{{button}}</span></a>
            </div>
          </div>
          <dl class="cta__data" data-reveal data-stagger>
            <div><dt>Sede</dt><dd>Arrecife, Lanzarote</dd></div>
            <div><dt>Ámbito</dt><dd>Obra residencial y no residencial: viviendas, locales y edificios</dd></div>
            <div><dt>Primer paso</dt><dd><a href="/contacto/">Cuéntanos tu proyecto</a></dd></div>
          </dl>
        </div>
      </section>
