    <script>
      // Activa las animaciones de entrada; si el JS principal no llega a cargar,
      // se desactivan para que el contenido nunca quede oculto.
      document.documentElement.classList.add('js');
      // Movimiento reducido: preferencia del sistema o ?motion=reduce (para revisarlo).
      if (
        window.matchMedia('(prefers-reduced-motion: reduce)').matches ||
        /[?&]motion=reduce\b/.test(location.search)
      ) {
        document.documentElement.classList.add('rm');
      }
      setTimeout(function () {
        if (!window.__ta) document.documentElement.classList.remove('js');
      }, 3000);
    </script>
